<?xml version="1.0"  encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pe="http://primefaces.org/ui/extensions"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="templates/mainLayout.xhtml">
    <ui:define name="centerContent">
        <h:form id="dataForm">
            <div class="card">
                <p:dataTable id="recordsTable" var="house" tableStyle="table-layout:auto"
                             resizableColumns="true" resizeMode="expand" value="#{houseView.houses}"
                             rows="25" lazy="true" paginator="true" paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                             rowsPerPageTemplate="5,10,25,{ShowAll|'All'}"
                             selection="#{houseView.selectedHouse}" selectionMode="single">
                    <f:facet name="header">
                        <div class="flex justify-content-between align-items-center">
                            Houses
                            <h:panelGroup id="headerPanel">
                                <p:selectOneMenu value="#{houseView.filterPropertyPublicId}" converter="uuidConverter" editable="false" style="width: 160px; padding-right: 5px;" label="Property">
                                    <f:selectItem itemLabel="Select Property" itemValue=""/>
                                    <f:selectItems value="#{houseView.properties}" var="property" itemLabel="#{property.description}" itemValue="#{property.publicId}"/>
                                    <p:ajax event="change" listener="#{houseView.filter()}" update=":dataForm:headerPanel :dataForm:recordsTable"/>
                                </p:selectOneMenu>
                                <p:outputLabel for="search" value="Search" style="padding-right: 5px;"/>
                                <p:inputText id="search"  value="#{houseView.searchParam}" style="padding-right: 5px;"/>
                                <p:commandButton value="Filter" actionListener="#{houseView.filter()}" update="@form" style="padding-right: 5px; padding-left: 5px;"/>
                                <p:commandButton value="Clear" actionListener="#{houseView.clear()}"
                                                 update=":dataForm:headerPanel :dataForm:recordsTable :inputForm" style="padding-right: 5px;"/>
                                <p:commandButton id="dlgBtn" value="#{houseView.dialogButtonTitle}" icon="pi pi-external-link" onclick="PF('dlg').show()"/>
                                <p:commandButton id="toggler" type="button" value="Columns" icon="pi pi-align-justify"/>
                                <p:columnToggler datasource="recordsTable" trigger="toggler"/>
                            </h:panelGroup>
                        </div>
                    </f:facet>

                    <p:ajax event="rowSelect" listener="#{houseView.onRowSelect}" update=":dataForm:recordsTable:headerPanel inputForm:inputDlgPanel"/>

                    <p:column headerText="Id">
                        <h:outputText value="#{house.id}"/>
                    </p:column>

                    <p:column headerText="Date Created">
                        <h:outputText value="#{house.dateCreated}">
                            <f:convertDateTime type="localDateTime" pattern="dd-MM-yyyy hh:mm:ss.SSS a"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Date Updated">
                        <h:outputText value="#{house.dateModified}">
                            <f:convertDateTime type="localDateTime" pattern="dd-MM-yyyy hh:mm:ss.SSS a"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{house.status}"/>
                    </p:column>

                    <p:column headerText="Number">
                        <h:outputText value="#{house.number}"/>
                    </p:column>

                    <p:column headerText="Floor">
                        <h:outputText value="#{house.floor.label}"/>
                    </p:column>

                    <p:column headerText="Area">
                        <h:outputText value="#{house.property.description}"/>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>
        <h:form id="inputForm">
            <p:growl id="growl-sticky" for="sticky-key" showDetail="true" sticky="true" />
            <p:dialog id="inputDlg" header="#{houseView.inputDialogTitle}" widgetVar="dlg" modal="false">
                <h:panelGrid id="inputDlgPanel" columns="3" cellpadding="7">
                    <p:outputLabel for="@next" value="Number"/>
                    <p:inputText value="#{houseView.houseRequest.number}" label="Number"/>
                    <p:message for="@previous"/>

                    <p:outputLabel for="@next" value="Floor"/>
                    <p:selectOneMenu value="#{houseView.houseRequest.floor}" editable="false" style="width: 160px" label="Floor">
                        <f:selectItem itemLabel="Select One" itemValue=""/>
                        <f:selectItems value="#{houseView.floors}"/>
                    </p:selectOneMenu>
                    <p:message for="@previous"/>

                    <p:outputLabel for="@next" value="Property"/>
                    <p:selectOneMenu value="#{houseView.houseRequest.propertyPublicId}" converter="uuidConverter" editable="false" style="width: 160px" label="Property">
                        <f:selectItem itemLabel="Select One" itemValue=""/>
                        <f:selectItems value="#{houseView.properties}" var="property" itemLabel="#{property.description}" itemValue="#{property.publicId}"/>
                    </p:selectOneMenu>
                    <p:message for="@previous"/>
                </h:panelGrid>
                <f:facet name="footer">
                    <p:commandButton value="Cancel" styleClass="ui-button-flat mr-2" style="width: 6rem" onclick="PF('dlg').hide()"/>
                    <p:commandButton id="btnSave" value="Save" style="width: 5rem"
                                     ajax="true"
                                     actionListener="#{houseView.saveHouse()}"
                                     update=":inputForm:inputDlgPanel :dataForm:recordsTable :inputForm:growl-sticky"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>

</html>
