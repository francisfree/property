spring.application.name=property
spring.profiles.active=@spring.profiles.active@

server.servlet.context-path=/property
server.servlet.session.timeout=60m
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:/db/changelog/liquibase.change-log.xml

spring.batch.job.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

joinfaces.primefaces.theme=bootstrap
joinfaces.faces.project-stage=development
joinfaces.faces-servlet.enabled=true
joinfaces.faces.automatic-extensionless-mapping=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \\(%line\\) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \\(%line\\) - %msg%n

springdoc.swagger-ui.path=/api-docs-ui.html
springdoc.api-docs.path=/api-docs

