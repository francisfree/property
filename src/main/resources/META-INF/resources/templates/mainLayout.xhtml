<?xml version="1.0"  encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pe="http://primefaces.org/ui/extensions"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <h:outputStylesheet name="default.css" library="css"/>
    <h:outputStylesheet name="primeflex3.css" library="css"/>
</h:head>
<h:body>

    <pe:layout resizerTip="Resize Default" togglerTipClosed="Close Default" togglerTipOpen="Open Default"
               sliderTip="Slide Default">
        <pe:layoutPane position="north" size="55" closable="false">
            <ui:include src="titleHeader.xhtml"/>
        </pe:layoutPane>
        <pe:layoutPane position="center">
            <ui:insert name="centerContent"/>
        </pe:layoutPane>
        <pe:layoutPane position="west" size="180">
            <ui:include src="navigation.xhtml"/>
        </pe:layoutPane>
        <pe:layoutPane position="south" size="25" closable="false" resizable="false">
            <ui:include src="footerHeader.xhtml"/>
        </pe:layoutPane>
    </pe:layout>

    <h:outputStylesheet id="layoutCSS">
        body {
            margin: 4px !important;
        }
    </h:outputStylesheet>
</h:body>
</html>
