spring.application.name=property
spring.profiles.active=@spring.profiles.active@

server.servlet.context-path=/property
server.servlet.session.timeout=60m
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:/db/changelog/liquibase.change-log.xml

spring.batch.job.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \\(%line\\) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \\(%line\\) - %msg%n

springdoc.swagger-ui.path=/api-docs-ui.html
springdoc.api-docs.path=/api-docs


# JWT Configuration
app.security.jwt.secret=${JWT_SECRET:Y2FzdGxlLXByb3BlcnR5LXNlY3JldC1rZXktZm9yLWRldi1vbmx5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
app.security.jwt.access-token-expiration=${JWT_EXPIRATION:900}
app.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800}

# Initial Admin (optional - for bootstrap)
app.security.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@example.com}
app.security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:admin123}

