server.servlet.context-path=/
spring.batch.job.enabled=false
spring.sql.init.continue-on-error=false
spring.sql.init.data-locations=classpath:data-test.sql
spring.datasource.driverClassName=org.h2.Driver
spring.sql.init.mode=embedded
spring.datasource.password=sa
spring.datasource.username=sa
spring.sql.init.platform=test
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.liquibase.change-log=classpath:/db/changelog/liquibase.change-log.xml
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \\(%line\\) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \\(%line\\) - %msg%n

# JWT Configuration for tests
app.security.jwt.secret=test-secret-key-for-testing-only-must-be-at-least-256-bits
app.security.jwt.access-token-expiration=900
app.security.jwt.refresh-token-expiration=604800

# Initial Admin for tests
app.security.initial-admin.username=admin
app.security.initial-admin.email=admin@example.com
app.security.initial-admin.password=admin123