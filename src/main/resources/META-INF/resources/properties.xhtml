<?xml version="1.0"  encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pe="http://primefaces.org/ui/extensions"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="templates/mainLayout.xhtml">
    <ui:define name="centerContent">
        <h:form id="dataForm">
            <p:growl id="growl-sticky" for="sticky-key" showDetail="true" sticky="true" />
            <div class="card">
                <p:dataTable id="recordsTable" var="property" tableStyle="table-layout:auto"
                             resizableColumns="true" resizeMode="expand" value="#{propertyView.properties}"
                             rows="25" lazy="true" paginator="true" paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                             rowsPerPageTemplate="5,10,25,{ShowAll|'All'}"
                             selection="#{propertyView.selectedProperty}" selectionMode="single">
                    <f:facet name="header">
                        <div class="flex justify-content-between align-items-center">
                            Properties
                            <h:panelGroup id="headerPanel">
                                <p:outputLabel for="search" value="Search" style="padding-right: 5px;"/>
                                <p:inputText id="search"  value="#{propertyView.searchParam}"
                                              style="padding-right: 5px;"/>
                                <p:commandButton value="Filter" actionListener="#{propertyView.filter()}"
                                                 update="@form" style="padding-right: 5px;"/>
                                <p:commandButton value="Clear" actionListener="#{propertyView.clear()}"
                                                 update="@form dataForm:panel" style="padding-right: 5px;"/>
                                <p:commandButton id="dlgBtn" value="#{propertyView.dialogButtonTitle}" icon="pi pi-external-link" onclick="PF('dlg').show()"/>
                                <p:commandButton id="toggler" type="button" value="Columns" icon="pi pi-align-justify"/>
                                <p:columnToggler datasource="recordsTable" trigger="toggler"/>
                            </h:panelGroup>
                        </div>
                    </f:facet>

                    <p:ajax event="rowSelect" listener="#{propertyView.onRowSelect}" update=":dataForm:recordsTable:headerPanel dataForm:panel"/>

                    <p:column headerText="Id">
                        <h:outputText value="#{property.id}"/>
                    </p:column>

                    <p:column headerText="Date Created">
                        <h:outputText value="#{property.dateCreated}">
                            <f:convertDateTime type="localDateTime" pattern="dd-MM-yyyy hh:mm:ss.SSS a"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Date Updated">
                        <h:outputText value="#{property.dateModified}">
                            <f:convertDateTime type="localDateTime" pattern="dd-MM-yyyy hh:mm:ss.SSS a"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Name">
                        <h:outputText value="#{property.name}"/>
                    </p:column>

                    <p:column headerText="Location">
                        <h:outputText value="#{property.location}"/>
                    </p:column>

                    <p:column headerText="Area">
                        <h:outputText value="#{property.area}"/>
                    </p:column>
                </p:dataTable>
            </div>
            <p:dialog id="inputDlg" header="#{propertyView.inputDialogTitle}" widgetVar="dlg" modal="false">
                <h:panelGrid id="panel" columns="3" cellpadding="7">
                    <p:outputLabel for="@next" value="Name"/>
                    <p:inputText value="#{propertyView.propertyRequest.name}" label="Name"/>
                    <p:message for="@previous"/>

                    <p:outputLabel for="@next" value="Location"/>
                    <p:inputText value="#{propertyView.propertyRequest.location}" label="Location"/>
                    <p:message for="@previous"/>

                    <p:outputLabel for="@next" value="Area"/>
                    <p:inputText value="#{propertyView.propertyRequest.area}" label="Area"/>
                    <p:message for="@previous"/>
                </h:panelGrid>

                <f:facet name="footer">
                    <p:commandButton value="Cancel" styleClass="ui-button-flat mr-2" style="width: 6rem" onclick="PF('dlg').hide()"/>
                    <p:commandButton id="btnSave" value="Save" style="width: 5rem"
                                     ajax="true"
                                     actionListener="#{propertyView.saveProperty()}"
                                     update=":dataForm:panel :dataForm:recordsTable :dataForm:growl-sticky"/>
                </f:facet>

            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>

</html>
